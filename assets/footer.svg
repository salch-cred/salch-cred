<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Let's build — agent infrastructure, settlement, adjudication">
  <defs>
    <pattern id="dot" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#FFFFFF" fill-opacity="0.14"/>
    </pattern>
    <clipPath id="cf"><rect x="14" y="14" width="1172" height="212" rx="24"/></clipPath>
  </defs>

  <rect width="1200" height="240" fill="#111111"/>
  <g clip-path="url(#cf)">
    <rect width="1200" height="240" fill="url(#dot)"/>

    <!-- yellow flower, right -->
    <g stroke="#111111" stroke-width="3">
      <g fill="#FFD84A">
        <circle cx="1018" cy="72" r="20"/><circle cx="1068" cy="100" r="20"/><circle cx="1068" cy="156" r="20"/>
        <circle cx="1018" cy="184" r="20"/><circle cx="968" cy="156" r="20"/><circle cx="968" cy="100" r="20"/>
      </g>
      <circle cx="1018" cy="128" r="22" fill="#FF5A3C"/>
    </g>

    <!-- pink flower, small -->
    <g stroke="#111111" stroke-width="2.6">
      <g fill="#FF9ECD">
        <circle cx="1120" cy="176" r="12"/><circle cx="1150" cy="194" r="12"/><circle cx="1135" cy="222" r="12"/>
      </g>
      <circle cx="1135" cy="197" r="12" fill="#FFFFFF"/>
    </g>

    <!-- starbursts -->
    <g fill="#A78BFA" stroke="#111111" stroke-width="3" stroke-linejoin="round">
      <path d="M604 52l6 15 16 2-12 11 3 16-13-8-14 8 3-16-12-11 16-2z"/>
    </g>
    <g fill="#6FE3B5" stroke="#111111" stroke-width="2.6" stroke-linejoin="round">
      <circle cx="700" cy="196" r="9"/>
    </g>

    <!-- sparkle line -->
    <path d="M560 180c30-26 58 22 88-2s58 22 88-2" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.5"/>
  </g>

  <rect x="14" y="14" width="1172" height="212" rx="24" fill="none" stroke="#FFD84A" stroke-width="6"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="56" y="76" fill="#FFD84A" font-size="11" font-weight="800" letter-spacing="3.4">07 / SAY HELLO</text>
    <text x="56" y="152" fill="#FFFFFF" font-size="56" font-weight="800" letter-spacing="-1.6">Let's build</text>
    <text x="56" y="188" fill="#FFFFFF" fill-opacity="0.66" font-size="15" font-weight="500">agent infrastructure · settlement · adjudication</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="1.6">
    <rect x="56" y="208" width="6" height="0"/>
  </g>

  <g stroke="#FFFFFF" stroke-width="0" fill="none"></g>
  <g stroke="#FFD84A" stroke-width="4" stroke-linecap="round">
    <path d="M470 128h30"/><path d="M514 120l10 8-10 8"/><path d="M542 128h140"/>
  </g>
</svg>
