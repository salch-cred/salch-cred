<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Salman Chhatwal — systems, agents, settlement rails">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16140F" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="#F3EDE3"/>

  <!-- clay blobs -->
  <g filter="url(#soft)">
    <circle cx="1052" cy="96" r="150" fill="#C0A8FF"/>
    <circle cx="1132" cy="252" r="96" fill="#D2F45B"/>
    <circle cx="128" cy="330" r="112" fill="#FF7C5B"/>
    <circle cx="300" cy="366" r="70" fill="#93E7C2"/>
  </g>
  <g fill="#F3EDE3" opacity="0.5">
    <circle cx="1002" cy="52" r="18"/>
    <circle cx="1128" cy="330" r="10"/>
  </g>

  <rect width="1200" height="380" filter="url(#grain)" opacity="0.5"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace">
    <!-- top tag -->
    <g>
      <rect x="72" y="48" width="228" height="34" rx="17" fill="#F3EDE3" stroke="#16140F" stroke-width="2"/>
      <circle cx="94" cy="65" r="5" fill="#FF7C5B"/>
      <text x="110" y="70" fill="#16140F" font-size="11" letter-spacing="2">OPEN TO HARD PROBLEMS</text>
    </g>
    <text x="72" y="126" fill="#6F6A60" font-size="11" letter-spacing="3">00 / IDENTITY</text>
  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" letter-spacing="-2">
    <text x="68" y="208" fill="#16140F" font-size="72">SALMAN</text>
    <text x="68" y="272" fill="#16140F" font-size="72">CHHATWAL</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace">
    <text x="72" y="306" fill="#16140F" font-size="12" letter-spacing="2.6">SYSTEMS · AGENTS · SETTLEMENT RAILS</text>

    <g>
      <rect x="72" y="326" width="150" height="30" rx="15" fill="#F3EDE3" stroke="#16140F" stroke-width="2"/>
      <text x="88" y="346" fill="#16140F" font-size="10.5" letter-spacing="1.6">MANGALURU, IN</text>
      <rect x="234" y="326" width="132" height="30" rx="15" fill="#F3EDE3" stroke="#16140F" stroke-width="2"/>
      <text x="250" y="346" fill="#16140F" font-size="10.5" letter-spacing="1.6">@salch-cred</text>
    </g>
  </g>

  <!-- clay stat disc -->
  <g transform="translate(940 232) rotate(-7)" filter="url(#soft)">
    <circle cx="0" cy="0" r="86" fill="#16140F"/>
    <circle cx="0" cy="0" r="78" fill="#D2F45B"/>
  </g>
  <g transform="translate(940 232) rotate(-7)" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="0" y="4" fill="#16140F" font-size="46" font-weight="800" letter-spacing="-2">374</text>
    <text x="0" y="26" fill="#16140F" font-size="9.5" font-weight="700" letter-spacing="1.8">UPSTREAM PRS</text>
  </g>
</svg>
