<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Salman — systems, agents, settlement rails">
  <defs>
    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#111111" fill-opacity="0.22"/>
    </pattern>
    <clipPath id="frame"><rect x="14" y="14" width="1172" height="372" rx="26"/></clipPath>
  </defs>

  <rect width="1200" height="400" fill="#FFD84A"/>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#halftone)"/>
    <path d="M0 320h1200v80H0z" fill="#FF5A3C" fill-opacity="0.14"/>
    <!-- speed lines -->
    <g stroke="#111111" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <path d="M36 268h44"/><path d="M24 288h64"/><path d="M40 308h36"/>
    </g>
    <!-- starburst accents -->
    <g fill="#FFFFFF" stroke="#111111" stroke-width="3" stroke-linejoin="round">
      <path d="M470 62l7 16 17 2-13 12 4 17-15-8-15 8 4-17-13-12 17-2z"/>
      <path d="M1128 96l5 11 12 1-9 8 3 12-11-6-10 6 3-12-9-8 12-1z"/>
    </g>
  </g>

  <rect x="14" y="14" width="1172" height="372" rx="26" fill="none" stroke="#111111" stroke-width="6"/>

  <g font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace">
    <rect x="56" y="52" width="252" height="40" rx="20" fill="#111111"/>
    <circle cx="80" cy="72" r="6" fill="#FFD84A"/>
    <text x="96" y="77" fill="#FFFFFF" font-size="11.5" letter-spacing="1.8">OPEN TO HARD PROBLEMS</text>
  </g>

  <g transform="rotate(-1.6 400 250)" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="118" font-weight="800" letter-spacing="-4">
    <text x="56" y="238" fill="#FFFFFF" stroke="#111111" stroke-width="10" paint-order="stroke" stroke-linejoin="round">SALMAN</text>
  </g>
  <text x="60" y="286" fill="#111111" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="14" letter-spacing="3">@salch-cred</text>

  <!-- speech bubble -->
  <g>
    <path d="M456 128h436a18 18 0 0 1 18 18v66a18 18 0 0 1-18 18H516l-34 30 6-30h-32a18 18 0 0 1-18-18v-66a18 18 0 0 1 18-18z" fill="#FFFFFF" stroke="#111111" stroke-width="4.5" stroke-linejoin="round"/>
    <g font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#111111" letter-spacing="1.4">
      <text x="492" y="176">SYSTEMS · AGENTS</text>
      <text x="492" y="204">SETTLEMENT RAILS</text>
    </g>
  </g>

  <!-- mascot -->
  <g>
    <g stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M812 250c-22-14-30-38-18-52"/>
      <path d="M1012 286c22 6 34 26 26 44"/>
    </g>
    <path d="M886 322c-46 0-76-30-76-70s34-72 82-72 82 32 82 72-42 70-88 70z" fill="#A78BFA" stroke="#111111" stroke-width="4.5"/>
    <g fill="#FFFFFF" stroke="#111111" stroke-width="4">
      <circle cx="884" cy="238" r="17"/>
      <circle cx="936" cy="238" r="17"/>
    </g>
    <g fill="#111111">
      <circle cx="887" cy="241" r="6.5"/>
      <circle cx="939" cy="241" r="6.5"/>
    </g>
    <path d="M892 276c10 12 30 12 40 0" fill="none" stroke="#111111" stroke-width="4.5" stroke-linecap="round"/>
    <g fill="#FF5A3C" fill-opacity="0.45">
      <circle cx="862" cy="270" r="9"/><circle cx="958" cy="270" r="9"/>
    </g>
    <g stroke="#111111" stroke-width="4.5" stroke-linecap="round">
      <path d="M862 320v18"/><path d="M932 322v16"/>
    </g>
  </g>

  <!-- sign -->
  <g transform="rotate(3 1050 300)">
    <rect x="1002" y="256" width="158" height="92" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="4.5"/>
    <text x="1081" y="300" text-anchor="middle" fill="#111111" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-2">374</text>
    <text x="1081" y="324" text-anchor="middle" fill="#111111" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.4">UPSTREAM PRS</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace">
    <rect x="56" y="330" width="176" height="36" rx="18" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <text x="76" y="354" fill="#111111" font-size="12" letter-spacing="2">MANGALURU, IN</text>
  </g>
</svg>
